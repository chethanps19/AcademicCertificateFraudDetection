<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Academic Certificate Fraud Detection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #173b8f, #2563eb);
            color: white;
            text-align: center;
            padding: 28px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 15px;
            opacity: 0.9;
        }

        /* Main container */
        .container {
            width: 90%;
            max-width: 720px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .title {
            text-align: center;
            color: #173b8f;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Form */
        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.10);
        }

        /* Upload area */
        .upload-box {
            border: 2px dashed #b8c7df;
            border-radius: 10px;
            padding: 25px 20px;
            text-align: center;
            margin-top: 5px;
            background: #fafcff;
        }

        .upload-icon {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .upload-text {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        input[type="file"] {
            width: 100%;
            font-size: 14px;
        }

        /* Button */
        .verify-btn {
            width: 100%;
            margin-top: 28px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #1769e0;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .verify-btn:hover {
            background: #1255b8;
        }

        .verify-btn:disabled {
            background: #7fa7df;
            cursor: not-allowed;
        }

        /* Result */
        .result {
            display: none;
            margin-top: 25px;
            padding: 22px;
            border-radius: 10px;
            line-height: 1.6;
        }

        /* Success */
        .success {
            display: block;
            background: #effaf1;
            border: 1px solid #a8d9ad;
            color: #1b5e20;
        }

        .success-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .success-description {
            font-size: 14px;
            margin-bottom: 18px;
        }

        .details {
            background: white;
            border: 1px solid #dce8df;
            border-radius: 8px;
            padding: 15px;
        }

        .detail-label {
            font-size: 12px;
            color: #777;
            margin-bottom: 3px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .hash {
            font-size: 11px;
            word-break: break-all;
            font-weight: normal;
            color: #555;
        }

        .checks {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
            font-weight: bold;
            font-size: 13px;
        }

        /* Error */
        .error {
            display: block;
            background: #fff0f0;
            border: 1px solid #ffb3b3;
            color: #b30000;
            text-align: center;
            font-weight: bold;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .container {
                width: 94%;
                padding: 22px;
                margin: 25px auto;
            }

            .header h1 {
                font-size: 22px;
            }

            .checks {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <h1>Academic Certificate Fraud Detection</h1>
        <p>Blockchain-Based Certificate Verification</p>
    </div>


    <!-- MAIN CONTAINER -->
    <div class="container">

        <h2 class="title">🔐 Verify Certificate</h2>

        <p class="subtitle">
            Enter the certificate details and upload the original PDF to verify its authenticity.
        </p>


        <!-- STUDENT NAME -->
        <label for="studentName">Student Name</label>

        <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
        >


        <!-- CERTIFICATE ID -->
        <label for="certificateId">Certificate ID</label>

        <input
            type="text"
            id="certificateId"
            placeholder="Example: CERT001"
        >


        <!-- UNIVERSITY -->
        <label for="university">University / Institution</label>

        <input
            type="text"
            id="university"
            placeholder="Enter university or institution"
        >


        <!-- CERTIFICATE UPLOAD -->
        <label>Certificate Document</label>

        <div class="upload-box">

            <div class="upload-icon">📄</div>

            <div class="upload-text">
                Upload the original certificate PDF
            </div>

            <input
                type="file"
                id="certificate"
                accept=".pdf"
            >

        </div>


        <!-- VERIFY BUTTON -->
        <button
            class="verify-btn"
            id="verifyButton"
            onclick="verifyCertificate()"
        >
            🔍 VERIFY CERTIFICATE
        </button>


        <!-- RESULT -->
        <div
            class="result"
            id="result"
        ></div>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        function verifyCertificate() {

            const studentName =
                document.getElementById("studentName").value.trim();

            const certificateId =
                document.getElementById("certificateId").value.trim();

            const university =
                document.getElementById("university").value.trim();

            const certificate =
                document.getElementById("certificate").files[0];

            const result =
                document.getElementById("result");

            const button =
                document.getElementById("verifyButton");


            /*
             * Clear previous result
             */
            result.className = "result";
            result.innerHTML = "";


            /*
             * Check required fields BEFORE
             * disabling the button.
             */
            if (
                !studentName ||
                !certificateId ||
                !university ||
                !certificate
            ) {

                result.className = "result error";

                result.innerHTML =
                    "Please fill all fields and upload a certificate.";

                return;
            }


            /*
             * Show loading state
             */
            button.disabled = true;
            button.innerText = "⏳ VERIFYING...";

            result.style.display = "block";
            result.className = "result";

            result.innerHTML =
                "Verifying certificate...";


            /*
             * Create FormData
             */
            const formData = new FormData();

            formData.append(
                "student_name",
                studentName
            );

            formData.append(
                "certificate_id",
                certificateId
            );

            formData.append(
                "university",
                university
            );

            formData.append(
                "certificate",
                certificate
            );


            /*
             * Send data to Flask
             */
            fetch("/verify", {
                method: "POST",
                body: formData
            })

            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "Server returned an error."
                    );
                }

                return response.json();
            })

            .then(data => {

                /*
                 * SUCCESS
                 */
                if (data.success) {

                    result.className =
                        "result success";

                    result.innerHTML = `

                        <div class="success-title">
                            ✅ Certificate Verified Successfully
                        </div>

                        <div class="success-description">
                            The certificate passed all verification checks.
                        </div>

                        <div class="details">

                            <div class="detail-label">
                                Certificate ID
                            </div>

                            <div class="detail-value">
                                ${data.certificate_id}
                            </div>


                            <div class="detail-label">
                                SHA-256 Certificate Hash
                            </div>

                            <div class="hash">
                                ${data.certificate_hash}
                            </div>

                        </div>


                        <div class="checks">

                            <span>✓ Database Match</span>

                            <span>✓ Blockchain Match</span>

                            <span>✓ Hash Verified</span>

                        </div>
                    `;

                }

                /*
                 * VERIFICATION FAILED
                 */
                else {

                    result.className =
                        "result error";

                    result.innerHTML =
                        "❌ " + data.message;
                }

            })

            /*
             * CONNECTION ERROR
             */
            .catch(error => {

                console.error(error);

                result.className =
                    "result error";

                result.innerHTML =
                    "❌ Unable to connect to verification server.";

            })

            /*
             * ALWAYS RESTORE BUTTON
             */
            .finally(() => {

                button.disabled = false;

                button.innerText =
                    "🔍 VERIFY CERTIFICATE";

            });

        }

    </script>

</body>

</html>
