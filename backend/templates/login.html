<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Academic Certificate Fraud Detection</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.10);
        }

        .title {
            text-align: center;
            margin-bottom: 8px;
            color: #1f3c88;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 20px;
            padding: 12px;

            border-radius: 8px;

            text-align: center;

            display: none;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #2563eb;

            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

<div class="login-container">

    <div class="login-card">

        <h1 class="title">
            🔐 Admin Login
        </h1>

        <p class="subtitle">
            Academic Certificate Fraud Detection
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button type="submit">
                LOGIN
            </button>

        </form>


        <div
            id="message"
            class="message">
        </div>


        <a
            href="/"
            class="back-link">
            ← Back to Certificate Verification
        </a>

    </div>

</div>


<script>

    const loginForm =
        document.getElementById("loginForm");

    const message =
        document.getElementById("message");


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const formData =
                new FormData(loginForm);


            try {

                const response =
                    await fetch(
                        "/login",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (data.success) {

                    message.className =
                        "message success";

                    message.style.display =
                        "block";

                    message.textContent =
                        "Login successful. Redirecting...";


                    setTimeout(
                        function() {

                            window.location.href =
                                "/admin";

                        },
                        500
                    );

                } else {

                    message.className =
                        "message error";

                    message.style.display =
                        "block";

                    message.textContent =
                        data.message;

                }

            } catch (error) {

                message.className =
                    "message error";

                message.style.display =
                    "block";

                message.textContent =
                    "Unable to connect to the server.";

            }

        }
    );

</script>

</body>

</html>
